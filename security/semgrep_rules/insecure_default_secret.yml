rules:
  - id: python-insecure-default-secret
    languages: [python]
    severity: ERROR
    message: >
      El segundo argumento de os.getenv/os.environ.get es un string no vacio
      para lo que parece ser un secreto. Si la variable de entorno falta,
      esto arranca en silencio con un valor conocido/adivinable en vez de
      fallar -- exactamente el bug encontrado en la auditoria de seguridad
      del 2026-08-15 en SPECTRE (api/dependencies.py, api/routes/auth.py) y
      VettedSec (app/auth/dependencies.py, app/auth/router.py), donde el
      secreto real de produccion termino siendo un placeholder tipo
      "dev_secret_key_change_me" -- forjable por cualquiera que conociera el
      string. Usar `os.environ["X"]` (KeyError si falta) o validar
      explicitamente `if not secret: raise` en vez de un default no vacio.
    metadata:
      category: security
      confidence: HIGH
      references:
        - "findings/2026-08-15_vps_security_audit.md"
    patterns:
      - pattern-either:
          - pattern: os.getenv($NAME, $DEFAULT)
          - pattern: os.environ.get($NAME, $DEFAULT)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|_key|api_key|apikey|password|passwd|token).*
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^"[^"]+"$

  - id: js-insecure-default-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Fallback no vacio para lo que parece ser un secreto leido de
      process.env. Mismo patron que causo hallazgos reales en esta sesion
      (Vigia c2-service, SPECTRE) aunque en otro lenguaje -- si la variable
      de entorno falta, el proceso arranca igual con un valor
      conocido/adivinable en vez de fallar. Preferir lanzar un error
      explicito si el valor no esta seteado.
    metadata:
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME || $DEFAULT
          - pattern: process.env[$NAME] || $DEFAULT
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|key|password|passwd|token).*
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^["'`][^"'`]+["'`]$

  - id: compose-env-hardcoded-secret
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*docker-compose*.yml"
        - "*docker-compose*.yaml"
    message: >
      Variable de entorno con nombre de secreto (SECRET/KEY/PASSWORD/TOKEN)
      seteada a un valor literal en vez de leerse de `${VAR}`/`.env`. Este
      archivo suele estar trackeado en git -- confirmado en esta sesion
      (docker-compose.yml de Vigia con jwt_secret hardcodeado, y de SPECTRE
      con `SECRET_KEY=dev_secret_key_change_me` corriendo asi en
      produccion real). Usar `${VAR:?falta VAR en .env}` para que falle
      fuerte si no esta seteada, nunca un literal.
    metadata:
      category: security
      confidence: MEDIUM
    pattern-regex: '(?im)^\s*-?\s*[A-Za-z_]*(SECRET|_KEY|PASSWORD|PASSWD|TOKEN)[A-Za-z_]*\s*[:=]\s*(?!\$\{|\$\(|~)[^\s#][^\n]*$'

  - id: yaml-config-hardcoded-secret
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.yaml"
        - "*.yml"
      exclude:
        - "*docker-compose*"
        - "*.example.*"
    message: >
      Clave de config con nombre de secreto seteada a un valor literal en
      un archivo de config (no docker-compose). Confirmado en esta sesion:
      api-gateway/config.yaml de Vigia tenia `jwt_secret: "supersecretkey"`
      commiteado en git, secreto real de produccion, no un placeholder de
      desarrollo. Sacar el valor real del archivo y leerlo de una variable
      de entorno en su lugar.
    metadata:
      category: security
      confidence: MEDIUM
    pattern-regex: '(?im)^\s*(jwt_secret|secret_key|api_key|auth_secret|master_key|encryption_key)\s*:\s*"[^"$][^"]*"\s*$'
